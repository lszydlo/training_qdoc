        const f = S.ui.lib;
        const t = f.q.trim().toLowerCase();
        return S.qdocs.filter((q) => libAccess(q, S.me) && (!f.type || q.type === f.type) && (!t || `${q.id} ${q.title}`.toLowerCase().includes(t)));
      }
      const accessPill = (a) => `<span class="pill ${a === 'Assigned' ? 'b' : a === 'Public' ? 'g' : ''}">${a === 'Assigned' ? 'Assigned to you' : a}</span>`;
      const libBody = (rows) =>
        rows
          .map((q) => {
            const e = effectiveOf(q);
            const k = S.qacks.find((x) => x.user === S.me && x.qid === q.id && x.vno === e.no);
            return `<tr><td class="mono nw"><a class="strong" href="#/library/${q.id}">${q.id}</a></td><td><a class="strong" href="#/library/${q.id}">${esc(q.title)}</a></td><td class="nw">${q.type}</td>
              <td class="mono">${e.no}</td><td class="nw">${e.effective}</td><td class="nw">${accessPill(libAccess(q, S.me))}</td><td class="nw">${k ? `<a href="#/qack/${k.id}" style="text-decoration:none">${qackPill(qackState(k))}</a>` : '<span class="no">not assigned</span>'}</td></tr>`;
          })
          .join('') || '<tr><td colspan="7" class="empty">No effective version matches.</td></tr>';
      function viewLibrary() {
        const f = S.ui.lib;
        return `<div class="head"><div><h1>Library</h1><p class="dim">${
          isQM(S.me)
            ? 'Every version in force today. Other users see only the versions assigned to them and the public ones.'
            : 'The versions in force today that are assigned to you, directly or through a group, and the public ones. Drafts, versions on their way and archived versions are not shown here.'
        }</p></div></div>
          <div class="bar"><input class="inp" id="libQ" type="search" placeholder="Search by ID or title" aria-label="Search" value="${esc(f.q)}" /></div>
          <div class="filters" role="group" aria-label="Document type">${[['', 'All types'], ...Object.keys(TYPES).map((t) => [t, t])].map(([k, l]) => `<button aria-pressed="${f.type === k}" data-act="libType" data-k="${k}">${l}</button>`).join('')}</div>
          <div class="scroll"><table><thead><tr><th>ID</th><th>Title</th><th>Type</th><th>Version</th><th>In force since</th><th>Access</th><th>My training</th></tr></thead><tbody id="libBody">${libBody(libRows())}</tbody></table></div>`;
      }
      function viewLibDoc(id) {
        const q = find(id);
        const e = q && !q.retired && effectiveOf(q);
        if (!e) return `<div class="card empty"><h2>${esc(id)} has no version in force</h2><p>The library shows only effective versions.</p><p style="margin-top:12px"><a class="btn" href="#/library">Back to the library</a></p></div>`;
        const access = libAccess(q, S.me);
        if (!access) return `<div class="card empty"><h2>${q.id} is not in your library</h2><p>The library shows you the effective versions assigned to you and the public ones.</p><p style="margin-top:12px"><a class="btn" href="#/library">Back to the library</a></p></div>`;
        const k = S.qacks.find((x) => x.user === S.me && x.qid === q.id && x.vno === e.no);
        const st = k && qackState(k);
        const note = !k
          ? ''
          : st === 'signed'
            ? `<div class="banner green">You signed the QACK for this version on ${k.signedAt}. <a href="#/qack/${k.id}">Training record</a></div>`
            : `<div class="banner ${st === 'overdue' ? 'red' : ''}">Your QACK for this version is ${st === 'overdue' ? `overdue since ${e.effective}` : `due on ${e.effective}`}. <a href="#/qack/${k.id}">${trainMode(e)}</a></div>`;
        return `<div class="crumbs"><a href="#/library">Library</a> / ${q.id}</div>
          <div class="head"><div><h1><span class="mono">${q.id}</span> ${esc(q.title)}</h1>
            <div class="meta"><span>${q.type}</span><span>version ${e.no}</span>${pill('Effective')}${accessPill(access)}<span>In force since ${e.effective}</span><span>Owner: ${esc(name(q.owner))}</span></div></div>
            <div class="acts">${!isEmp(S.me) && visible(q, S.me) ? `<a class="btn" href="#/qdoc/${q.id}">Open in QDocs</a>` : ''}</div></div>
          ${note}
          <div class="read">${e.files.map((f) => `<div class="card"><div class="head"><h2>${esc(f.name)}</h2></div>${fileBody(f)}</div>`).join('')}</div>`;
      }

      function viewTraining() {
        const order = { overdue: 0, 'to sign': 1, signed: 2, closed: 3 };
        const rows = S.qacks
          .filter((k) => k.user === S.me)
          .map((k) => ({ k, st: qackState(k), q: find(k.qid), v: versionOf(k) }))
          .filter((x) => x.q && x.v)
          .sort((a, b) => order[a.st] - order[b.st] || a.v.effective.localeCompare(b.v.effective));
        return `<div class="head"><div><h1>My training</h1><p class="dim">Your QACKs: one for each published version you have to learn. A signed QACK is your training record and is kept when the version is archived.</p></div></div>
          <div class="scroll"><table><thead><tr><th>ID</th><th>Title</th><th>Version</th><th>Training</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${
            rows
              .map(
                ({ k, st, q, v }) => `<tr><td class="mono nw"><a class="strong" href="#/qack/${k.id}">${q.id}</a></td><td><a class="strong" href="#/qack/${k.id}">${esc(q.title)}</a></td><td class="mono">${v.no}</td>
                <td>${trainMode(v)}</td><td class="nw">${v.effective}</td><td class="nw">${qackPill(st)}${st === 'signed' ? ` <span class="dim small">${k.signedAt}</span>` : ''}</td>
                <td class="r"><a class="btn sm ${st === 'overdue' || st === 'to sign' ? 'primary' : ''}" href="#/qack/${k.id}">${st === 'signed' ? 'Record' : st === 'closed' ? 'Open' : Object.keys(k.read).length ? 'Continue' : 'Start'}</a></td></tr>`,
              )
              .join('') || '<tr><td colspan="7" class="empty">No QACK is assigned to you.</td></tr>'
          }</tbody></table></div>`;
      }

      // One QACK: read every file, pass the quiz if the version has one, then sign.
      function viewQack(id) {
        const k = S.qacks.find((x) => x.id === id);
        const back = `<p style="margin-top:12px"><a class="btn" href="#/training">My training</a></p>`;
        if (!k || !versionOf(k)) return `<div class="card empty"><h2>No such QACK</h2>${back}</div>`;
        if (k.user !== S.me) return `<div class="card empty"><h2>This QACK belongs to ${esc(name(k.user))}</h2><p>A QACK is one person's obligation; nobody signs it for them.</p>${back}</div>`;
        const q = find(k.qid);
        const v = versionOf(k);
        const st = qackState(k);
        const open = st === 'to sign' || st === 'overdue';
        const signed = st === 'signed';
        const nRead = v.files.filter((f) => k.read[f.id]).length;
        const allRead = signed || nRead === v.files.length;
        const hasQuiz = v.quiz.on && v.quiz.questions.length > 0;
        const quizOk = !hasQuiz || k.quizPassed;
        const at = signed ? 3 : !allRead ? 0 : !quizOk ? 1 : 2;
        const steps = [[0, 'Read every file'], ...(hasQuiz ? [[1, 'Pass the quiz']] : []), [2, 'Sign']];
        const banner = {
          signed: `<div class="banner green">Signed on ${k.signedAt}. This QACK is your training record for version ${v.no}.</div>`,
          overdue: `<div class="banner red"><b>Overdue since ${v.effective}.</b> Version ${v.no} is in force. You can still sign this QACK.</div>`,
          'to sign': `<div class="banner">Due on ${v.effective}, the day version ${v.no} becomes effective. It becomes effective on that date whether or not you have signed.</div>`,
          closed: `<div class="banner">Closed: version ${v.no} is no longer in force, so there is nothing left to sign.</div>`,
        }[st];
        const files = v.files
          .map(
            (f) => `<div class="card"><div class="head"><h3>${esc(f.name)}</h3>${signed || k.read[f.id] ? '<span class="pill g">Read</span>' : ''}</div>${fileBody(f)}
              ${open && !k.read[f.id] ? `<div class="foot"><button class="btn sm primary" data-act="readFile" data-fid="${f.id}">I have read this file</button></div>` : ''}</div>`,
          )
          .join('');
        const z = S.ui.quiz && S.ui.quiz.kid === k.id ? S.ui.quiz : null;
        const quiz = !hasQuiz
          ? ''
          : `<section><h2>Quiz</h2>${
              k.quizPassed
                ? `<div class="card"><span class="pill g">Passed</span> <span class="dim">on attempt ${k.attempts}, every answer correct.</span></div>`
                : !open
                  ? '<div class="card dim">Not taken.</div>'
                  : !allRead
                    ? '<div class="card locked">The quiz opens when you have read every file.</div>'
                    : `<form class="card" data-form="quiz">
                        ${z ? `<p class="err" role="alert" style="margin:0 0 12px">Attempt ${k.attempts}: ${v.quiz.questions.length - z.wrong.length} of ${v.quiz.questions.length} correct. The quiz is passed only with every answer correct. Change your answers and try again.</p>` : ''}
                        ${v.quiz.questions
                          .map(
                            (x, i) => `<fieldset class="qz"><legend>${i + 1}. ${esc(x.q)}${z && z.wrong.includes(i) ? ' <span class="pill r">Not correct</span>' : ''}</legend>
                            ${x.options.map((o, j) => `<label><input type="radio" name="q${i}" value="${j}" required ${z && z.answers[i] === j ? 'checked' : ''} /> ${esc(o)}</label>`).join('')}</fieldset>`,
                          )
                          .join('')}
                        <div class="acts"><button class="btn primary">${k.attempts ? 'Try again' : 'Check answers'}</button><span class="dim small" style="align-self:center">${k.attempts ? plural(k.attempts, 'attempt') + ' so far. ' : ''}You can retake the quiz.</span></div></form>`
            }</section>`;
        const left = [!allRead && `${v.files.length - nRead} of ${plural(v.files.length, 'file')} left to read`, allRead && !quizOk && 'the quiz is not passed yet'].filter(Boolean)[0];
        const signBox = signed
          ? `<div class="card"><dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0"><dt class="dim">Signed by</dt><dd style="margin:0"><b>${esc(name(k.user))}</b></dd><dt class="dim">Time</dt><dd style="margin:0">${k.signedAt}</dd>
              <dt class="dim">Meaning</dt><dd style="margin:0">I have read and understood ${q.id} ${esc(q.title)}, version ${v.no}.</dd><dt class="dim">Training</dt><dd style="margin:0">${hasQuiz ? `Read, quiz passed${k.attempts ? ` on attempt ${k.attempts}` : ''}, signed` : 'Read and signed'}</dd></dl></div>`
          : !open
            ? '<div class="card dim">Not signed.</div>'
            : `<div class="card"><div class="acts" style="align-items:center"><button class="btn primary" data-act="signQack" ${left ? 'disabled' : ''}>Sign QACK</button><span class="dim small">${left ? `Not yet: ${left}.` : 'Signing needs your password again.'}</span></div></div>`;
        return `<div class="crumbs"><a href="#/training">My training</a> / ${q.id} version ${v.no}</div>
          <div class="head"><div><h1><span class="mono">${q.id}</span> ${esc(q.title)}</h1>
            <div class="meta"><span>QACK</span><span>version ${v.no}</span>${qackPill(st)}<span>${trainMode(v)}</span><span>Due ${v.effective}</span></div></div></div>
          <ol class="steps" aria-label="Training steps">${steps.map(([i, l]) => `<li class="${i < at ? 'done' : i === at && open ? 'now' : ''}" ${i === at && open ? 'aria-current="step"' : ''}>${l}</li>`).join('')}</ol>
          ${banner}
          <section><h2>Read${open ? ` <span class="dim small" style="font-weight:400">${nRead} of ${plural(v.files.length, 'file')} read</span>` : ''}</h2><div class="read">${files}</div></section>
          ${quiz}
          <section><h2>${signed ? 'Training record' : 'Sign'}</h2>${signBox}</section>`;
      }

      // Only quality managers read the audit log; nobody edits or deletes an entry.
      function auditRows() {
        const f = S.ui.audit;
        const t = f.q.trim().toLowerCase();
        return S.audit.filter((a) => (!f.actor || a.actor === f.actor) && (!f.action || a.action === f.action) && (!t || `${a.actor} ${a.action} ${a.record}`.toLowerCase().includes(t)));
      }
      const auditBody = (rows) =>
        rows.map((a) => `<tr><td class="dim small nw">${a.when}</td><td class="nw">${esc(a.actor)}</td><td>${esc(a.action)}</td><td>${esc(a.record)}</td></tr>`).join('') ||
        '<tr><td colspan="4" class="empty">No entry matches.</td></tr>';
      const auditCount = (rows) => `${rows.length} of ${S.audit.length} entries`;
      function viewAudit() {
        if (!isQM(S.me)) return `<div class="card empty"><h2>Audit log</h2><p>Only quality managers read the audit log.</p><p style="margin-top:12px"><a class="btn" href="#/work">Back to my work</a></p></div>`;
        const f = S.ui.audit;
        const opts = (key, all) => `<option value="">${all}</option>${[...new Set(S.audit.map((a) => a[key]))].sort().map((x) => `<option ${x === f[key] ? 'selected' : ''}>${esc(x)}</option>`).join('')}`;
        const rows = auditRows();
        return `<div class="head"><div><h1>Audit log</h1><p class="dim">Every lifecycle and training action in the system: who or what did it, to which record, and when. Nobody, administrators included, can edit or delete an entry.</p></div></div>
          <div class="bar"><select class="inp" aria-label="Actor" data-chg="auditF" data-f="actor">${opts('actor', 'Every actor')}</select>
            <select class="inp" aria-label="Action" data-chg="auditF" data-f="action">${opts('action', 'Every action')}</select>
            <input class="inp" id="auditQ" type="search" placeholder="Search a record, for example SOP-4" aria-label="Search" value="${esc(f.q)}" />
            <span class="dim small" id="auditCount">${auditCount(rows)}</span></div>
          <div class="scroll"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Record</th></tr></thead><tbody id="auditBody">${auditBody(rows)}</tbody></table></div>
          <p class="hint">Field-level changes of one QDoc, with previous and new values, are on its Activity tab.</p>`;
      }

      function bannerFor(q, v, r) {
        if (q.retired)
          return `<div class="banner red"><b>Retired by ${esc(name(q.retired.who))}</b> on ${q.retired.when}, with an electronic signature.<blockquote>${esc(q.retired.reason)}</blockquote>
            <p class="small" style="margin-top:6px">No version is in force. The versions, the activity and the signed QACKs are kept.</p></div>`;
        const eff = effectiveOf(q);
        const applies = eff && eff !== v ? ` Until then version ${eff.no} applies.` : '';
        if (v.status === 'Draft' && v.declined)
          return `<div class="banner red"><b>Declined by ${esc(name(v.declined.who))}</b> on ${v.declined.when}, with an electronic signature.<blockquote>${esc(v.declined.comment)}</blockquote>
            <p class="small" style="margin-top:6px">The version is back with the owner. A file you change loses its approvals; the others keep theirs.</p></div>`;
        const text = {
          Draft: r.owner
            ? 'Draft. Only contributors and quality managers see this version. Name the people, resolve every suggestion, then send it on.'
            : r.qm
              ? 'Draft. As a quality manager you do on this QDoc what its owner and contributors do.'
              : 'Draft. You are a contributor: write, comment and suggest. The owner sends the version on.',
          'In review': r.reviewer
            ? `Review requested by ${name(q.owner)}. Read each file, comment or suggest, then mark it as reviewed. A mark is an acknowledgement, not a verdict.`
            : 'In review. The content is locked: nobody edits, adds or removes a file. Revert to draft to resolve suggestions.',
          'In approval': r.approver
            ? 'Approve each file with your electronic signature, or decline the version with a comment. Nobody comments in this status.'
            : 'In approval. Nobody comments in this status. A decline hands the version back to the owner.',
          Approved: r.qm
            ? `Approved as version ${v.no}, not yet effective. Publish it with an effective date; each recipient then gets a QACK.${applies}`
            : `Approved as version ${v.no}. Approved is not effective: a quality manager publishes it with an effective date.${applies}`,
          Published: `Published. Becomes effective on ${v.effective}, whether or not every QACK is signed.${applies} QACKs assigned: ${v.qacks?.total ?? 0}.${r.qm ? ' You can still change the date.' : ''}`,
          Effective: `In force since ${v.effective}. QACKs signed: ${v.qacks?.signed ?? 0} of ${v.qacks?.total ?? 0}.`,
        }[v.status];
        return `<div class="banner ${v.status === 'Effective' || v.status === 'Approved' ? 'green' : ''}">${esc(text)}</div>`;
      }

      function actionsFor(q, v, r) {
        if (q.retired) return '';
        const lead = r.owner || r.qm;
        const b = [];
        if (lead && v.status === 'Draft') {
          b.push(`<button class="btn danger" data-act="deleteDraft">Delete draft</button>`);
          b.push(`<button class="btn" data-act="sendReview">Send for review</button>`);
          b.push(`<button class="btn primary" data-act="sendApproval">Send for approval</button>`);
        }
        if (lead && v.status === 'In review') {
          b.push(`<button class="btn" data-act="revert">Revert to draft</button>`);
          b.push(`<button class="btn primary" data-act="sendApproval">Send for approval</button>`);
        }
        if (r.approver && v.status === 'In approval') b.push(`<button class="btn danger" data-act="decline">Decline version</button>`);
        if (r.qm && v.status === 'Approved') b.push(`<button class="btn primary" data-act="publish">Publish</button>`);
        if (r.qm && v.status === 'Published') b.push(`<button class="btn" data-act="reschedule">Change effective date</button>`);
        if (r.qm && v.status === 'Effective') b.push(`<button class="btn danger" data-act="retire">Retire QDoc</button>`);
        if ((lead || r.contributor) && v.status === 'Effective') b.push(`<button class="btn primary" data-act="newDraft">New draft version</button>`);
        return b.join('');
      }

      function fileAction(v, f, p) {
        if (p.mark) return marked(v, f, S.me) ? '<span class="pill g">Reviewed by you</span>' : `<button class="btn sm primary" data-act="mark" data-fid="${f.id}">Mark as reviewed</button>`;
        if (p.approve) return approved(v, f, S.me) ? '<span class="pill g">Approved by you</span>' : `<button class="btn sm primary" data-act="approve" data-fid="${f.id}">Approve</button>`;
        return '';
      }

      function tabFiles(q, v, r, p) {
        const frac = (list, test) => (list.length ? `${list.filter(test).length}/${list.length}` : '<span class="no">n/a</span>');
        const content = v.files.filter((f) => f.kind === 'content');
        const rows = v.files
          .map((f) => {
            const isPdf = f.kind === 'pdf';
            const scan = { quarantine: 'Quarantined', released: 'Released', failed: 'Failed' }[f.scan];
            const nameCell = isPdf
              ? `<b>${esc(f.name)}</b> <span class="dim small">${f.size}</span> ${pill(scan)}${f.scan === 'failed' ? `<div class="small dim">${esc(f.reason)} Stays listed until a contributor removes it.</div>` : ''}${f.scan === 'quarantine' ? '<div class="small dim">Being scanned for malware and inappropriate content.</div>' : ''}`
              : `<a class="strong" href="#/qdoc/${q.id}/file/${f.id}">${esc(f.name)}</a>`;
            const acts = [fileAction(v, f, p)];
            if (isPdf && f.scan === 'released') acts.push(`<button class="btn sm" data-act="download" data-fid="${f.id}">Download</button>`);
            if (!isPdf) acts.push(`<a class="btn sm" href="#/qdoc/${q.id}/file/${f.id}">${p.edit ? 'Edit' : 'Open'}</a>`);
            if (p.edit && (isPdf || content.length > 1)) acts.push(`<button class="btn sm ghost danger" data-act="removeFile" data-fid="${f.id}">Remove</button>`);
            return `<tr><td>${nameCell}</td><td class="nw">${isPdf ? 'PDF attachment' : 'Content file'}</td>
              <td class="num">${isPdf ? '' : f.comments.length}</td><td class="num">${isPdf ? '' : f.suggestions.filter((s) => s.status === 'open').length}</td>
              <td class="num">${frac(v.reviewers, (u) => marked(v, f, u))}</td><td class="num">${frac(v.approvers, (u) => approved(v, f, u))}</td><td class="r"><span class="acts" style="justify-content:flex-end">${acts.join('')}</span></td></tr>`;
          })
          .join('');
        const matrix = (title, people, test, hint) =>
          `<section><h2>${title}</h2><p class="dim small" style="margin:-6px 0 8px">${hint}</p><div class="scroll"><table><thead><tr><th>File</th>${people.map((u) => `<th class="num">${esc(name(u))}${isQM(u) ? ' (QM)' : ''}</th>`).join('')}</tr></thead>
            <tbody>${v.files.map((f) => `<tr><td>${esc(f.name)}</td>${people.map((u) => `<td class="num">${test(f, u) ? '<span class="ok" aria-label="done">✓</span>' : '<span class="no" aria-label="waiting">–</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
        const ready = readiness(v);
        return `<section><div class="head" style="margin-bottom:10px"><h2>Files in version ${v.no}</h2>${
          p.edit ? `<div class="acts"><button class="btn sm" data-act="addFile">Add content file</button><button class="btn sm" data-act="upload">Upload PDF</button></div>` : ''
        }</div>
          <div class="scroll"><table><thead><tr><th>File</th><th>Kind</th><th class="num">Comments</th><th class="num">Open suggestions</th><th class="num">Reviewed</th><th class="num">Approved</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
          ${v.status !== 'Draft' ? '<p class="hint">Outside draft nobody edits, adds or removes a file.</p>' : ''}</section>
          ${p.lead && !q.retired && ['Draft', 'In review'].includes(v.status) ? `<section><div class="card"><h2>Ready for approval?</h2><ul class="check">${ready.map((c) => `<li><span class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✕'}</span><span>${c.text}</span></li>`).join('')}</ul></div></section>` : ''}
          ${v.reviewers.length && v.status !== 'Draft' ? matrix('Review marks', v.reviewers, (f, u) => marked(v, f, u), 'One mark per reviewer and file. The owner is told once, when every reviewer has marked every file.') : ''}
          ${['In approval', 'Approved', 'Published', 'Effective'].includes(v.status) && v.approvers.length ? matrix('Approvals', v.approvers, (f, u) => approved(v, f, u), 'The version is approved once each approver has approved each file.') : ''}`;
      }

      function tabPeople(q, v, r, p) {
        const all = Object.keys(U);
        const users = all.filter((u) => !isEmp(u));
        const pub = `<label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" data-chg="public" ${v.public ? 'checked' : ''} ${p.manage ? '' : 'disabled'} style="margin-top:4px" />
          <span><b>Public</b>: once effective, every user reads this version in the library, not only its recipients. Only recipients get a QACK.</span></label>`;
        const lists = [
          { key: 'contributors', title: 'Contributors', hint: 'Authors who write the files with the owner.', fixed: [q.owner], pool: users.filter((u) => u !== q.owner && !isQM(u)) },
          { key: 'reviewers', title: 'Reviewers', hint: 'Review is optional. The owner cannot be a reviewer.', pool: users.filter((u) => u !== q.owner) },
          { key: 'approvers', title: 'Approvers', hint: 'Each approver approves each file. At least one is a quality manager.', pool: users, warn: !v.approvers.some(isQM) && 'No quality manager among the approvers yet.' },
          { key: 'recipients', title: 'Recipients', hint: `Users and groups who learn this version and read it in the library. ${plural(rcpCount(v), 'person')} will get a QACK.`, extra: pub, pool: [...Object.keys(G).map((g) => 'g:' + g), ...all.map((u) => 'u:' + u)], rcp: true },
        ];
        return `<div class="grid2">${lists
          .map((l) => {
            const label = (id) => (l.rcp ? rcp(id) : name(id) + (isQM(id) ? ' (quality manager)' : ''));
            const left = l.pool.filter((id) => !v[l.key].includes(id));
            return `<div class="card"><h2>${l.title}</h2><p class="dim small" style="margin-bottom:10px">${l.hint}</p>
              <div class="chips">${(l.fixed || []).map((u) => `<span class="chip plain">${esc(name(u))} <span class="pill b">owner</span></span>`).join('')}${
                v[l.key].map((id) => `<span class="chip ${p.manage ? '' : 'plain'}">${esc(label(id))}${p.manage ? `<button aria-label="Remove ${esc(label(id))}" data-act="rmPerson" data-list="${l.key}" data-id="${id}">✕</button>` : ''}</span>`).join('') ||
                (l.fixed ? '' : '<span class="dim small">Nobody named.</span>')
              }</div>
              ${l.warn ? `<p class="err">${l.warn}</p>` : ''}${l.extra || ''}
              ${p.manage && left.length ? `<label class="field">Add<select data-chg="addPerson" data-list="${l.key}"><option value="">Choose…</option>${left.map((id) => `<option value="${id}">${esc(label(id))}</option>`).join('')}</select></label>` : ''}
            </div>`;
          })
          .join('')}</div>${p.manage ? '' : `<p class="hint">${p.lead ? 'People are named while the version is a draft.' : 'Only the owner and the quality managers name the people on a QDoc.'}</p>`}`;
      }

      function tabTraining(q, v, r, p) {
        const dis = p.manage ? '' : 'disabled';
        const prev = effectiveOf(q);
        const k = v.qacks;
        const due = v.effective && v.effective < today();
        const stat = (n, l) => `<div class="stat"><b>${n}</b>${l}</div>`;
        const qacks = k
          ? `<div class="card" style="margin-bottom:16px"><h2>QACKs for version ${v.no}</h2><div class="stats">${stat(k.total, 'assigned')}${stat(k.signed, 'signed')}${stat(due ? 0 : k.total - k.signed, 'to sign')}${stat(due ? k.total - k.signed : 0, 'overdue')}</div>
              <p class="hint">Due on the effective date, ${v.effective}. An overdue QACK can still be signed; a signed QACK is the training record.</p></div>`
          : '';
        return `${qacks}<div class="grid2"><div class="card"><h2>How recipients train</h2>
            <label style="display:flex;gap:8px"><input type="radio" name="mode" ${v.quiz.on ? '' : 'checked'} ${dis} data-chg="quizOn" value="" /> Read and sign</label>
            <label style="display:flex;gap:8px"><input type="radio" name="mode" ${v.quiz.on ? 'checked' : ''} ${dis} data-chg="quizOn" value="1" /> Read, pass the quiz and sign</label>
            <p class="hint">The QACK is due on the effective date and can still be signed when overdue.</p></div>
          <div class="card"><h2>Earlier signers</h2>${
            prev && prev !== v
              ? `<label style="display:flex;gap:8px"><input type="checkbox" ${v.retrain ? 'checked' : ''} ${dis} data-chg="retrain" /> Recipients who signed version ${prev.no} train again on this version</label><p class="hint">The owner decides this for each version.</p>`
              : '<p class="dim">This QDoc has no earlier effective version; every recipient trains.</p>'
          }</div></div>
          ${
            v.quiz.on
              ? `<section><div class="head" style="margin-bottom:10px"><div><h2>Quiz</h2><p class="dim small">Multiple choice. Passed only with every answer correct; it can be retaken.</p></div>${p.manage ? '<button class="btn sm" data-act="addQuestion">Add question</button>' : ''}</div>
                <div class="rows">${
                  v.quiz.questions
                    .map(
                      (x, i) => `<div class="card"><div class="head" style="margin-bottom:6px"><h3>${i + 1}. ${esc(x.q)}</h3>${p.manage ? `<button class="btn sm ghost danger" data-act="rmQuestion" data-i="${i}">Remove</button>` : ''}</div>
                      <ul class="check">${x.options.map((o, k) => `<li><span class="${k === x.correct ? 'ok' : 'no'}">${k === x.correct ? '✓' : '○'}</span><span>${esc(o)}</span></li>`).join('')}</ul></div>`,
                    )
                    .join('') || '<div class="card empty">No questions yet.</div>'
                }</div></section>`
              : ''
          }${p.manage ? '' : '<p class="hint">Training is set by the owner while the version is a draft.</p>'}`;
      }

      function tabActivity(q) {
        return `<p class="dim small" style="margin-bottom:10px">Per QDoc, field level: what changed, from what to what, who and when. Append-only.</p>
          <div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>Property</th><th>Previous value</th><th>New value</th></tr></thead><tbody>${q.activity
            .map((a) => `<tr><td class="dim small" style="white-space:nowrap">${a.when}</td><td>${esc(name(a.who))}</td><td>${esc(a.prop)}</td><td class="dim">${esc(a.prev)}</td><td>${esc(a.next)}</td></tr>`)
            .join('')}</tbody></table></div>`;
      }

      function tabVersions(q) {
        const vs = q.versions;
        const cmp = S.ui.cmp && S.ui.cmp.id === q.id ? S.ui.cmp : { id: q.id, a: vs[Math.max(0, vs.length - 2)].no, b: vs[vs.length - 1].no };
        S.ui.cmp = cmp;
        const a = vs.find((v) => v.no === cmp.a) || vs[0];
        const b = vs.find((v) => v.no === cmp.b) || vs[vs.length - 1];
        const text = (v, n) => {
          const f = v.files.find((x) => x.kind === 'content' && x.name === n);
          return f ? f.paras.map((p) => p.text).join(' ¶ ') : null;
        };
        const fileNames = [...new Set([...a.files, ...b.files].filter((f) => f.kind === 'content').map((f) => f.name))];
        const opts = (sel) => vs.map((v) => `<option ${v.no === sel ? 'selected' : ''}>${v.no}</option>`).join('');
        return `<section><h2>Version history</h2><div class="scroll"><table><thead><tr><th>Version</th><th>Status</th><th>Effective date</th><th>Files</th><th>QACKs signed</th></tr></thead><tbody>${[...vs]
          .reverse()
          .map((v) => `<tr><td class="mono">${v.no}</td><td>${pill(v.status)}</td><td>${v.effective || '<span class="no">not set</span>'}</td><td>${v.files.length}</td><td>${v.qacks ? `${v.qacks.signed} of ${v.qacks.total}` : '<span class="no">n/a</span>'}</td></tr>`)
          .join('')}</tbody></table></div><p class="hint">An archived version and its signed QACKs are kept.</p></section>
          ${
            vs.length > 1
              ? `<section><div class="head" style="margin-bottom:10px"><h2>Compare</h2><div class="acts" style="align-items:center"><select class="inp" style="width:auto" aria-label="From version" data-chg="cmp" data-side="a">${opts(a.no)}</select><span class="dim">with</span><select class="inp" style="width:auto" aria-label="To version" data-chg="cmp" data-side="b">${opts(b.no)}</select></div></div>
                <div class="rows">${fileNames
                  .map((n) => {
                    const ta = text(a, n);
                    const tb = text(b, n);
                    const state = ta === null ? '<span class="pill g">Added</span>' : tb === null ? '<span class="pill r">Removed</span>' : ta === tb ? '<span class="pill">Unchanged</span>' : '<span class="pill y">Changed</span>';
                    return `<div class="card"><div class="head" style="margin-bottom:8px"><h3>${esc(n)}</h3>${state}</div><div>${diffHtml(ta ?? '', tb ?? '')}</div></div>`;
                  })
                  .join('')}</div><p class="hint"><ins>Additions</ins> and <del>removals</del> are marked.</p></section>`
              : '<section><div class="card empty">Comparison needs two versions; this QDoc has one.</div></section>'
          }`;
      }

      function viewFile(q, v, r, f) {
        const p = perms(v, r);
        const open = f.suggestions.filter((s) => s.status === 'open');
        const paras = f.paras
          .map((x) => {
            const s = open.find((o) => o.pid === x.id);
            const nC = f.comments.filter((c) => c.pid === x.id).length;
            const body = s
              ? `<div class="ptext" title="Resolve the suggestion to edit this paragraph">${diffHtml(x.text, s.to)}</div>`
              : `<div class="ptext" ${p.edit ? `contenteditable="plaintext-only" role="textbox" aria-label="${x.h ? 'Heading' : 'Paragraph'}" data-pid="${x.id}" data-ph="${x.h ? 'Heading' : 'Write here'}"` : ''}>${esc(x.text)}</div>`;
            const badges = `${nC ? `<button class="pill b" style="border:0;cursor:pointer" data-act="focusPara" data-pid="${x.id}">${plural(nC, 'comment')}</button>` : ''}${s ? `<button class="pill v" style="border:0;cursor:pointer" data-act="focusPara" data-pid="${x.id}">Suggestion by ${esc(name(s.who))}</button>` : ''}`;
            return `<div class="para ${x.h ? 'h' : ''} ${S.ui.focus === x.id ? 'focus' : ''}" id="${x.id}">${body}${badges ? `<div class="ptools">${badges}</div>` : ''}<div class="pacts">
              ${p.comment ? `<button class="btn sm ghost" data-act="compose" data-kind="comment" data-pid="${x.id}">Comment</button>` : ''}
              ${p.comment && !s ? `<button class="btn sm ghost" data-act="compose" data-kind="suggest" data-pid="${x.id}">Suggest</button>` : ''}
              ${p.edit && !s && f.paras.length > 1 ? `<button class="btn sm ghost danger" data-act="rmPara" data-pid="${x.id}">Remove</button>` : ''}
            </div></div>`;
          })
          .join('');

        const quote = (pid) => {
          const x = f.paras.find((y) => y.id === pid);
          const t = x ? x.text : 'Paragraph removed';
          return `<div class="quote">${esc(t.length > 90 ? t.slice(0, 90) + '…' : t)}</div>`;
        };
        const c = S.ui.composer;
        const composer =
          c && f.paras.some((x) => x.id === c.pid)
            ? `<form class="thread" data-form="composer"><h3>${c.kind === 'comment' ? 'New comment' : 'Suggest an edit'}</h3>${quote(c.pid)}
                <textarea class="inp" name="text" required aria-label="${c.kind === 'comment' ? 'Comment' : 'Suggested text'}">${c.kind === 'suggest' ? esc(f.paras.find((x) => x.id === c.pid).text) : ''}</textarea>
                <div class="acts" style="margin-top:8px;justify-content:flex-end"><button type="button" class="btn sm" data-act="cancelCompose">Cancel</button><button class="btn sm primary">${c.kind === 'comment' ? 'Comment' : 'Suggest'}</button></div></form>`
            : '';
        const threads = [
          ...f.suggestions.map((s) => ({ t: 's', x: s })),
          ...f.comments.map((x) => ({ t: 'c', x })),
        ]
          .sort((a, b) => (a.x.status === 'open' ? 0 : 1) - (b.x.status === 'open' ? 0 : 1) || b.x.when.localeCompare(a.x.when))
          .map(({ t, x }) => {
            const by = `<div class="by"><span><b>${esc(name(x.who))}</b> ${t === 's' ? 'suggests' : 'comments'}</span><span>${x.when}</span></div>`;
            if (t === 'c')
              return `<div class="thread">${by}<button class="quote" style="border:0;cursor:pointer;text-align:left;width:100%" data-act="focusPara" data-pid="${x.pid}">${quote(x.pid).replace(/^<div class="quote">|<\/div>$/g, '')}</button><p>${esc(x.text)}</p>
                ${x.replies.map((y) => `<div class="reply"><div class="by"><b>${esc(name(y.who))}</b><span>${y.when}</span></div><p>${esc(y.text)}</p></div>`).join('')}
                ${p.comment ? `<form class="inline" data-form="reply" data-cid="${x.id}"><input class="inp" name="text" required placeholder="Reply" aria-label="Reply" /><button class="btn sm">Reply</button></form>` : ''}</div>`;
            const para = f.paras.find((y) => y.id === x.pid);
            const body = x.status === 'open' && para ? diffHtml(para.text, x.to) : esc(x.to);
            const state =
              x.status !== 'open'
                ? `<span class="pill ${x.status === 'accepted' ? 'g' : ''}">${x.status === 'accepted' ? 'Accepted' : 'Discarded'} by ${esc(name(x.by))}</span>`
                : p.resolve
                  ? `<button class="btn sm primary" data-act="resolve" data-sid="${x.id}" data-to="accepted">Accept</button><button class="btn sm" data-act="resolve" data-sid="${x.id}" data-to="discarded">Discard</button>`
                  : `<span class="dim small">${p.lead ? 'Revert to draft to accept or discard.' : 'The owner accepts or discards it.'}</span>`;
            return `<div class="thread ${x.status === 'open' ? '' : 'closed'}">${by}<p>${body}</p><div class="acts" style="margin-top:8px;align-items:center">${state}</div></div>`;
          })
          .join('');
        const history = f.history.map((h) => `<div class="thread"><div class="by"><b>${esc(name(h.who))}</b><span>${h.when}</span></div><p>${esc(h.what)}</p></div>`).join('') || '<div class="thread dim">No changes recorded.</div>';
        const others = [q.owner, ...v.contributors].filter((u) => u !== S.me);
        const rule = { Draft: p.comment ? '' : 'In draft only contributors comment.', 'In review': p.comment ? '' : 'In review the owner, the reviewers and the quality managers comment.', 'In approval': 'Nobody comments while the version is in approval.' }[v.status] ?? 'Comments are closed for this version.';

        return `<div class="crumbs"><a href="#/qdocs">QDocs</a> / <a href="#/qdoc/${q.id}">${q.id} ${esc(q.title)}</a> / ${esc(f.name)}</div>
          <div class="head"><div><h1>${esc(f.name)}</h1><div class="meta"><span class="mono">${q.id}</span><span>version ${v.no}</span>${pill(v.status)}
            ${p.edit ? `<span class="presence" id="saved">Every edit is kept</span>${others.length ? `<span class="presence"><span class="dot"></span>Also editing: ${esc(names(others.slice(0, 1)))}</span>` : ''}` : '<span>Locked: read only</span>'}</div></div>
            <div class="acts">${fileAction(v, f, p)}<a class="btn" href="#/qdoc/${q.id}">Back to ${q.id}</a></div></div>
          <div class="fileview"><div><div class="doc">${paras}</div>
            ${p.edit ? `<div class="acts" style="margin-top:10px"><button class="btn sm" data-act="addPara">Add paragraph</button><button class="btn sm" data-act="addPara" data-h="1">Add heading</button></div>` : ''}</div>
            <aside class="panel" aria-label="Comments, suggestions and change history">
              <div class="tabs" style="margin:0"><button aria-pressed="${S.ui.panel === 'threads'}" data-act="panel" data-k="threads">Comments and suggestions</button><button aria-pressed="${S.ui.panel === 'history'}" data-act="panel" data-k="history">Change history</button></div>
              ${S.ui.panel === 'history' ? history : `${composer}${rule ? `<p class="hint" style="margin:0">${rule}</p>` : ''}${threads || '<div class="thread dim">No comments or suggestions on this file.</div>'}`}
            </aside></div>`;
      }

      function viewQdoc(q, tab, fid) {
        const v = cur(q);
        const r = roles(q, v, S.me);
        if (!visible(q, S.me))
          return `<div class="card empty"><h2>${q.id} is not visible to ${esc(name(S.me))}</h2><p>Version ${v.no} is ${v.status.toLowerCase()}. A draft is visible only to its contributors and the quality managers.</p><p style="margin-top:12px"><a class="btn" href="#/qdocs">Back to QDocs</a></p></div>`;
        const f = fid && v.files.find((x) => x.id === fid && x.kind === 'content');
        if (tab === 'file' && f) return viewFile(q, v, r, f);
        const p = perms(v, r);
        const tabs = [['files', 'Files'], ['people', 'People'], ['training', 'Training'], ['activity', 'Activity'], ['versions', 'Versions']];
        const t = tabs.some(([k]) => k === tab) ? tab : 'files';
        const at = q.retired ? -1 : STEPS.indexOf(v.status);
        const body = { files: tabFiles, people: tabPeople, training: tabTraining, activity: tabActivity, versions: tabVersions }[t](q, v, r, p);
        return `<div class="crumbs"><a href="#/qdocs">QDocs</a> / ${q.id}</div>
          <div class="head"><div><h1><span class="mono">${q.id}</span> ${esc(q.title)}</h1>
            <div class="meta"><span>${q.type}</span><span>version ${v.no}</span>${q.retired ? pill('Retired') : pill(v.status)}<span>Owner: ${esc(name(q.owner))}</span>${v.public ? '<span class="pill g">Public</span>' : ''}${roleNames(r).map((x) => `<span class="pill b">You: ${x}</span>`).join('')}</div></div>
            <div class="acts">${actionsFor(q, v, r)}</div></div>
          <ol class="steps" aria-label="Lifecycle">${STEPS.map((s, i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}" ${i === at ? 'aria-current="step"' : ''}>${s}</li>`).join('')}</ol>
          ${bannerFor(q, v, r)}
          <nav class="tabs" aria-label="QDoc sections">${tabs.map(([k, l]) => `<a href="#/qdoc/${q.id}/${k}" ${k === t ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
          ${body}`;
      }

      // ---------- Render and routing ----------
      const route = () => {
        const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
        return p[0] ? p : ['work'];
      };
      const openQ = () => (route()[0] === 'qdoc' ? find(route()[1]) : null);
      const openK = () => (route()[0] === 'qack' ? S.qacks.find((k) => k.id === route()[1]) : null);
      const openF = () => {
        const q = openQ();
        return q && cur(q).files.find((f) => f.id === route()[3]);
      };

      function renderProto() {
        const q = openQ();
        const sim = [];
        if (q && visible(q, S.me) && !q.retired) {
          const v = cur(q);
          v.files.filter((f) => f.kind === 'pdf' && f.scan === 'quarantine').forEach((f) => {
            sim.push(`<button data-act="simScan" data-fid="${f.id}" data-res="released">Scan releases ${esc(f.name)}</button>`);
            sim.push(`<button data-act="simScan" data-fid="${f.id}" data-res="failed">Scan fails it</button>`);
          });
          if (v.status === 'In review') sim.push('<button data-act="simReview">Other reviewers mark every file</button>');
          if (v.status === 'In approval') sim.push('<button data-act="simApprove">Other approvers approve every file</button>');
          if (v.status === 'Approved' && !isQM(S.me)) sim.push('<button data-act="simPublish">Quality manager publishes</button>');
          if (v.status === 'Published') sim.push('<button data-act="simEffective">Effective date arrives</button>');
        }
        $('#proto').innerHTML = `<span class="proto-tag">Prototype</span>
          <label>Signed in as <select data-chg="persona">${PERSONAS.map((u) => `<option value="${u}" ${u === S.me ? 'selected' : ''}>${esc(name(u))} (${U[u].level.toLowerCase()})</option>`).join('')}</select></label>
          <label>Jump to <select data-chg="jump"><option value="">a scenario…</option>${SCENARIOS.map((s, i) => `<option value="${i}">${s[0]}</option>`).join('')}</select></label>
          ${sim.length ? `<span class="sim"><span>Simulate others:</span>${sim.join('')}</span>` : ''}
          <button class="push" data-act="reset">Reset data</button>`;
      }

      function render() {
        const r = route();
        const q = r[0] === 'qdoc' ? find(r[1]) : null;
        const emp = isEmp(S.me);
        const authorsOnly = `<div class="card empty"><h2>QDocs in preparation are for authors</h2><p>Employees read the versions in force in the library and learn new versions through their QACKs.</p><p style="margin-top:12px"><a class="btn" href="#/library">Open the library</a></p></div>`;
        const body = r[0] === 'audit' ? viewAudit() : r[0] === 'library' ? (r[1] ? viewLibDoc(r[1]) : viewLibrary()) : r[0] === 'training' ? viewTraining() : r[0] === 'qack' ? viewQack(r[1]) : emp && (r[0] === 'qdocs' || r[0] === 'qdoc') ? authorsOnly : r[0] === 'qdocs' ? viewList() : r[0] === 'qdoc' ? (q ? viewQdoc(q, r[2], r[3]) : `<div class="card empty">No such QDoc. <a href="#/qdocs">Back to QDocs</a></div>`) : viewWork();
        const n = tasks(S.me).length;
        $('#app').innerHTML = `<div class="shell"><nav class="side" aria-label="Main"><div class="brand">QDoc</div>
          <a class="nav ${r[0] === 'work' ? 'on' : ''}" href="#/work">My work${n ? `<span class="count" aria-label="${n} to do">${n}</span>` : ''}</a>
          ${emp ? '' : `<a class="nav ${r[0] === 'qdocs' || r[0] === 'qdoc' ? 'on' : ''}" href="#/qdocs">QDocs</a>`}
          <a class="nav ${r[0] === 'library' ? 'on' : ''}" href="#/library">Library</a>
          <a class="nav ${r[0] === 'training' || r[0] === 'qack' ? 'on' : ''}" href="#/training">My training</a>
          ${isQM(S.me) ? `<a class="nav ${r[0] === 'audit' ? 'on' : ''}" href="#/audit">Audit log</a>` : ''}
          <div class="who"><b>${esc(name(S.me))}</b><span class="dim">${U[S.me].level}</span></div></nav><main class="main">${body}</main></div>`;
        renderProto();
        if (S.ui.edit) {
          const el = document.querySelector(`[data-pid="${S.ui.edit}"][contenteditable]`);
          S.ui.edit = null;
          el?.focus();
        }
      }
      addEventListener('hashchange', () => {
        S.ui.composer = null;
        S.ui.focus = null;
        S.ui.quiz = null;
        render();
        scrollTo(0, 0);
      });

      // ---------- Actions ----------
      const A = {
        reset() {
          S = seed();
          location.hash = '#/work';
          render();
        },
        filter(d) {
          S.filter = d.k;
        },
        panel(d) {
          S.ui.panel = d.k;
        },
        focusPara(d) {
          S.ui.focus = S.ui.focus === d.pid ? null : d.pid;
          S.ui.panel = 'threads';
        },
        compose(d) {
          S.ui.composer = { kind: d.kind, pid: d.pid };
          S.ui.focus = d.pid;
          S.ui.panel = 'threads';
        },
        cancelCompose() {
          S.ui.composer = null;
        },
        download(d) {
          toast(`Download of ${openQ() && cur(openQ()).files.find((f) => f.id === d.fid).name} started.`);
        },

        newQdoc() {
          const preview = (t) => `ID will be <b class="mono">${TYPES[t]}-${S.next[TYPES[t]]}</b>. The first draft is version 0.1 and you are its owner.`;
          openDlg(
            `<h2>New QDoc</h2><label class="field">Title<input name="title" required autofocus /></label>
             <label class="field">Document type<select name="type" data-chg="typePreview">${Object.keys(TYPES).map((t) => `<option ${t === 'SOP' ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
             <p class="hint" id="idPreview">${preview('SOP')}</p>${dlgActs('Create QDoc')}`,
            ({ title, type }) => {
              const pre = TYPES[type];
              const q = { id: `${pre}-${S.next[pre]++}`, title: title.trim(), type, owner: S.me, updated: stamp(), activity: [], versions: [ver('0.1', 'Draft', { files: [cfile('Main text', [['']])] })] };
              log(q, S.me, 'Version', 'none', '0.1 draft opened');
              audit(S.me, 'QDoc created', rec(q, cur(q)));
              S.qdocs.unshift(q);
              location.hash = `#/qdoc/${q.id}`;
            },
          );
          dlg.preview = preview;
          return false;
        },

        addFile() {
          openDlg(`<h2>Add content file</h2><label class="field">File name<input name="name" required autofocus /></label>${dlgActs('Add file')}`, ({ name: n }) => {
            const q = openQ();
            const f = cfile(n.trim(), [['']]);
            cur(q).files.push(f);
            log(q, S.me, 'Files', 'none', `Content file added: ${f.name}`);
          });
          return false;
        },
        upload() {
          const samples = [
            ['Annex A, wiring diagram.pdf', '2.1 MB', ''],
            ['Photo renamed to .pdf', '0.9 MB', 'Rejected: the content is not a PDF.'],
            ['Oversized scan.pdf', '310 MB', 'Rejected: the file is over the size limit.'],
          ];
          openDlg(
            `<h2>Upload PDF</h2><p class="dim small">PDF only, checked from the content, within the size limit. An upload stays in quarantine until it is scanned.</p>
             <label class="field">Sample file<select name="i">${samples.map((s, i) => `<option value="${i}">${s[0]} (${s[1]})</option>`).join('')}</select></label>${dlgActs('Upload')}`,
            ({ i }) => {
              const [n, size, err] = samples[i];
              if (err) return err;
              const q = openQ();
              cur(q).files.push(pdf(n, size, 'quarantine'));
              log(q, S.me, 'Files', 'none', `Attachment uploaded: ${n} (quarantined)`);
              audit(S.me, 'Attachment uploaded', rec(q, cur(q), n));
              toast('Uploaded. The attachment is in quarantine until the scan finishes.');
            },
          );
          return false;
        },
        removeFile(d) {
          const q = openQ();
          const v = cur(q);
          const f = v.files.find((x) => x.id === d.fid);
          confirmDlg(`Remove ${f.name}?`, '<p>The file leaves this draft version. Earlier versions keep theirs.</p>', 'Remove', () => {
            v.files = v.files.filter((x) => x !== f);
            delete v.marks[f.id];
            delete v.approvals[f.id];
            log(q, S.me, 'Files', f.name, 'removed');
          }, 'danger');
          return false;
        },
        addPara(d) {
          const x = para('', d.h);
          openF().paras.push(x);
          S.ui.edit = x.id;
        },
        rmPara(d) {
          const q = openQ();
          const f = openF();
          f.paras = f.paras.filter((x) => x.id !== d.pid);
          touch(q, cur(q), f, 'Removed a paragraph');
        },
        resolve(d) {
          const q = openQ();
          const f = openF();
          const s = f.suggestions.find((x) => x.id === d.sid);
          s.status = d.to;
          s.by = S.me;
          audit(S.me, `Suggestion ${d.to}`, rec(q, cur(q), f.name));
          if (d.to === 'accepted') {
            const x = f.paras.find((y) => y.id === s.pid);
            if (x) x.text = s.to;
            touch(q, cur(q), f, `Accepted a suggestion by ${name(s.who)}`);
          }
        },
        rmPerson(d) {
          const q = openQ();
          const v = cur(q);
          const label = (l) => (d.list === 'recipients' ? (l.map(rcp).join(', ') || 'none') : names(l));
          const prev = label(v[d.list]);
          v[d.list] = v[d.list].filter((x) => x !== d.id);
          log(q, S.me, d.list[0].toUpperCase() + d.list.slice(1), prev, label(v[d.list]));
        },
        addQuestion() {
          openDlg(
            `<h2>Add quiz question</h2><label class="field">Question<input name="q" required autofocus /></label>
             <label class="field">Option A<input name="a" required /></label><label class="field">Option B<input name="b" required /></label><label class="field">Option C (optional)<input name="c" /></label>
             <label class="field">Correct answer<select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></label>${dlgActs('Add question')}`,
            (f) => {
              const options = [f.a, f.b, f.c].map((s) => s.trim()).filter(Boolean);
              if (+f.correct >= options.length) return 'Option C is empty, so it cannot be the correct answer.';
              const q = openQ();
              cur(q).quiz.questions.push({ q: f.q.trim(), options, correct: +f.correct });
              log(q, S.me, 'Quiz', plural(cur(q).quiz.questions.length - 1, 'question'), plural(cur(q).quiz.questions.length, 'question'));
            },
          );
          return false;
        },
        rmQuestion(d) {
          const q = openQ();
          const qs = cur(q).quiz.questions;
          qs.splice(+d.i, 1);
          log(q, S.me, 'Quiz', plural(qs.length + 1, 'question'), plural(qs.length, 'question'));
        },

        sendReview() {
          const q = openQ();
          const v = cur(q);
          if (!v.reviewers.length) {
            toast('Name at least one reviewer first, or send the version straight for approval: review is optional.');
            location.hash = `#/qdoc/${q.id}/people`;
            return false;
          }
          confirmDlg(`Send version ${v.no} for review?`, `<p>The content is locked: nobody edits, adds or removes a file until you revert to draft.</p><dl><dt>Reviewers</dt><dd>${esc(names(v.reviewers))}</dd></dl>`, 'Send for review', () => {
            v.status = 'In review';
            v.declined = null;
            v.reviewsDone = false;
            log(q, S.me, 'Status', 'Draft', 'In review');
            audit(S.me, 'Version sent for review', rec(q, v));
            notify(v.reviewers, `${q.id} ${q.title} was sent for review. You are a reviewer.`, `#/qdoc/${q.id}`);
            checkReviews(q, v);
          });
          return false;
        },
        sendApproval() {
          const q = openQ();
          const v = cur(q);
          const ready = readiness(v);
          const ok = ready.every((c) => c.ok);
          openDlg(
            `<h2>Send version ${v.no} for approval?</h2><ul class="check">${ready.map((c) => `<li><span class="${c.ok ? 'ok' : 'no'}">${c.ok ? '✓' : '✕'}</span><span>${c.text}</span></li>`).join('')}</ul>
             ${ok ? `<dl><dt>Approvers</dt><dd>${esc(names(v.approvers))}</dd></dl><p class="hint">Each approver approves each file with an electronic signature. Nobody comments while the version is in approval.</p>` : `<p class="err">${v.status === 'In review' && openSuggestions(v) ? 'Revert to draft to resolve the open suggestions.' : 'Complete the open points first.'}</p>`}
             ${dlgActs('Send for approval', 'primary', !ok)}`,
            () => {
              log(q, S.me, 'Status', v.status, 'In approval');
              audit(S.me, 'Version sent for approval', rec(q, v));
              v.status = 'In approval';
              v.declined = null;
              notify(v.approvers, `${q.id} ${q.title} was sent for approval. You are an approver.`, `#/qdoc/${q.id}`);
              checkApproved(q, v);
            },
          );
          return false;
        },
        revert() {
          const q = openQ();
          const v = cur(q);
          const next = bumpMinor(v.no);
          confirmDlg('Revert to draft?', `<p>Contributors can edit again and you can accept or discard suggestions. The draft becomes version ${next}.</p><p class="hint">A file changed after the revert loses its review marks; the others keep theirs.</p>`, 'Revert to draft', () => {
            log(q, S.me, 'Status', 'In review', 'Draft');
            log(q, S.me, 'Version number', v.no, next);
            audit(S.me, 'Version reverted to draft', rec(q, v));
            v.status = 'Draft';
            v.no = next;
          });
          return false;
        },
        deleteDraft() {
          const q = openQ();
          const v = cur(q);
          const eff = effectiveOf(q);
          confirmDlg(`Delete draft ${v.no}?`, eff ? `<p>The effective version ${eff.no} stays in force.</p>` : `<p>${q.id} has no other version, so the QDoc goes with its draft.</p>`, 'Delete draft', () => {
            audit(S.me, 'Draft deleted', rec(q, v));
            if (eff) {
              q.versions.pop();
              log(q, S.me, 'Version', `${v.no} draft`, 'deleted');
            } else S.qdocs = S.qdocs.filter((x) => x !== q);
            location.hash = eff ? `#/qdoc/${q.id}` : '#/qdocs';
          }, 'danger');
          return false;
        },
        newDraft() {
          const q = openQ();
          const e = cur(q);
          const no = `${e.no.split('.')[0]}.1`;
          q.versions.push(
            ver(no, 'Draft', {
              files: e.files.map((f) => (f.kind === 'pdf' ? { ...f } : { ...f, paras: f.paras.map((x) => ({ ...x })), comments: [], suggestions: [], history: [{ who: S.me, when: stamp(), what: `File copied from version ${e.no}` }] })),
              contributors: [...e.contributors],
              reviewers: [...e.reviewers],
              approvers: [...e.approvers],
              recipients: [...e.recipients],
              public: e.public,
              quiz: { on: e.quiz.on, questions: e.quiz.questions.map((x) => ({ ...x })) },
            }),
          );
          log(q, S.me, 'Version', `${e.no} effective`, `${no} draft opened`);
          audit(S.me, 'Draft version opened', rec(q, cur(q)));
          toast(`Draft ${no} opened. Version ${e.no} stays in force until the new one is effective.`);
        },
        mark(d) {
          const q = openQ();
          const v = cur(q);
          markReviewed(q, v, v.files.find((f) => f.id === d.fid), S.me);
        },
        approve(d) {
          const q = openQ();
          const v = cur(q);
          const f = v.files.find((x) => x.id === d.fid);
          sign(`Approval of "${f.name}" in ${q.id} ${q.title}, version ${v.no}.`, () => {
            approveFile(q, v, f, S.me);
            checkApproved(q, v);
          });
          return false;
        },
        decline() {
          const q = openQ();
          const v = cur(q);
          sign(
            `Decline of ${q.id} ${q.title}, version ${v.no}. The version goes back to ${name(q.owner)}.`,
            ({ comment }) => {
              v.status = 'Draft';
              v.declined = { who: S.me, when: stamp(), comment: comment.trim() };
              log(q, S.me, 'Status', 'In approval', 'Draft (declined, signed)');
              audit(S.me, 'Version declined (signed)', rec(q, v));
              notify(q.owner, `${q.id} ${q.title} was declined by ${name(S.me)}.`, `#/qdoc/${q.id}`);
              if (!visible(q, S.me)) location.hash = '#/work';
            },
            '<label class="field">Reason for declining<textarea name="comment" required></textarea></label>',
          );
          return false;
        },

        dl(d) {
          toast(`Download of ${d.n} started.`);
          return false;
        },
        libType(d) {
          S.ui.lib.type = d.k;
        },
        readFile(d) {
          openK().read[d.fid] = true;
        },
        signQack() {
          const k = openK();
          const q = find(k.qid);
          const v = versionOf(k);
          sign(`I have read and understood ${q.id} ${q.title}, version ${v.no}.`, () => {
            k.status = 'signed';
            k.signedAt = stamp();
            v.qacks.signed++;
            audit(S.me, 'QACK signed', rec(q, v));
            toast('Signed. The QACK is now your training record.');
          });
          return false;
        },

        // Only a quality manager publishes: an approved version, with an effective date and a signature.
        publish() {
          const q = openQ();
          const v = cur(q);
          const eff = effectiveOf(q);
          const today = ymd(new Date());
          const d = new Date();
          d.setDate(d.getDate() + 14);
          const n = qackCount(q, v);
          sign(
            `Publication of ${q.id} ${q.title}, version ${v.no}.`,
            ({ date }) => {
              if (date < today) return 'The effective date cannot be in the past.';
              publish(q, v, S.me, date);
              toast(date === today ? `Published and effective today.` : `Published. ${plural(v.qacks.total, 'QACK')} assigned; effective on ${date}.`);
            },
            `<label class="field">Effective date<input type="date" name="date" required min="${today}" value="${ymd(d)}" /></label>
             <dl><dt>Recipients</dt><dd>${v.recipients.length ? esc(v.recipients.map(rcp).join(', ')) : 'none'}</dd>
               <dt>Library</dt><dd>${v.public ? 'Public: every user reads it' : 'Recipients only'}</dd>
               <dt>Training</dt><dd>${v.quiz.on ? `Read, pass the quiz (${plural(v.quiz.questions.length, 'question')}) and sign` : 'Read and sign'}</dd>
               <dt>QACKs to assign</dt><dd>${n.total}${n.skip ? ` (${n.skip} earlier signers do not train again)` : ''}</dd></dl>
             <p class="hint">${eff ? `Until the effective date version ${eff.no} applies. ` : ''}The version becomes effective on its date whether or not every QACK is signed.</p>
             ${v.recipients.length ? '' : '<p class="err">No recipients are named: nobody gets a QACK.</p>'}`,
          );
          return false;
        },
        // Until the version is effective a quality manager can move its date; open QACKs become due on the new date.
        reschedule() {
          const q = openQ();
          const v = cur(q);
          const prev = v.effective;
          const open = v.qacks.total - v.qacks.signed;
          sign(
            `Change of the effective date of ${q.id} ${q.title}, version ${v.no}.`,
            ({ date }) => {
              if (date < today()) return 'The effective date cannot be in the past.';
              if (date === prev) return 'This is the current effective date.';
              v.effective = date;
              log(q, S.me, 'Effective date', prev, date);
              audit(S.me, 'Effective date changed (signed)', rec(q, v, `${prev} to ${date}`));
              notify(q.owner, `${q.id} ${q.title} version ${v.no}: effective date moved from ${prev} to ${date}.`, `#/qdoc/${q.id}`);
              S.qacks.filter((k) => k.qid === q.id && k.vno === v.no && k.status !== 'signed' && k.user !== q.owner).forEach((k) => notify(k.user, `QACK due date moved: ${q.id} ${q.title} version ${v.no} is now due on ${date}.`, `#/qack/${k.id}`));
              if (date <= today()) makeEffective(q, v);
              toast(date === today() ? 'Effective date moved to today: the version is now effective.' : `Effective date moved to ${date}.`);
            },
            `<dl><dt>Current date</dt><dd>${prev}</dd><dt>Open QACKs</dt><dd>${open} of ${v.qacks.total}, due on the new date</dd></dl>
             <label class="field">New effective date<input type="date" name="date" required min="${today()}" value="${prev}" /></label>
             <p class="hint">Today's date makes the version effective at once.</p>`,
          );
          return false;
        },
        // Only a quality manager retires a QDoc no longer needed.
        retire() {
          const q = openQ();
          const v = cur(q);
          sign(
            `Retirement of ${q.id} ${q.title}. Version ${v.no} stops being in force.`,
            ({ reason }) => {
              q.retired = { who: S.me, when: stamp(), reason: reason.trim() };
              v.status = 'Archived';
              log(q, S.me, 'QDoc', 'Active', 'Retired (signed)');
              log(q, null, `Version ${v.no}`, 'Effective', 'Archived');
              audit(S.me, 'QDoc retired (signed)', q.id);
              audit(null, 'Version archived', rec(q, v));
              notify(q.owner, `${q.id} ${q.title} was retired by ${name(S.me)}.`, `#/qdoc/${q.id}`);
            },
            `<label class="field">Reason for retiring<textarea name="reason" required></textarea></label>
             <p class="hint">The library stops showing this QDoc. Its versions, activity and signed QACKs are kept.</p>`,
          );
          return false;
        },

        simScan(d) {
          const q = openQ();
          const f = cur(q).files.find((x) => x.id === d.fid);
          f.scan = d.res;
          f.reason = d.res === 'failed' ? 'The scan found malware.' : '';
          log(q, null, `Scan: ${f.name}`, 'Quarantined', d.res === 'failed' ? 'Failed' : 'Released');
          audit(null, d.res === 'failed' ? 'Attachment failed the scan' : 'Attachment released', rec(q, cur(q), f.name));
        },
        simReview() {
          const q = openQ();
          const v = cur(q);
          v.reviewers.filter((u) => u !== S.me).forEach((u) => v.files.filter((f) => !marked(v, f, u)).forEach((f) => markReviewed(q, v, f, u)));
        },
        simApprove() {
          const q = openQ();
          const v = cur(q);
          v.approvers.filter((u) => u !== S.me).forEach((u) => v.files.filter((f) => !approved(v, f, u)).forEach((f) => approveFile(q, v, f, u)));
          checkApproved(q, v);
        },
        simPublish() {
          const q = openQ();
          const d = new Date();
          d.setDate(d.getDate() + 14);
          publish(q, cur(q), 'ewa', ymd(d));
        },
        simEffective() {
          const q = openQ();
          makeEffective(q, cur(q));
        },
      };

      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || !A[el.dataset.act]) return;
        if (A[el.dataset.act](el.dataset) !== false) render();
      });

      document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-chg]');
        if (!el) return;
        const k = el.dataset.chg;
        const q = openQ();
        if (k === 'typePreview') return void ($('#idPreview').innerHTML = dlg.preview(el.value));
        if (k === 'persona') (S.me = el.value), (S.filter = 'all');
        if (k === 'auditF') S.ui.audit[el.dataset.f] = el.value;
        if (k === 'jump' && el.value) {
          const [, who, hash] = SCENARIOS[el.value];
          S.me = who;
          S.filter = 'all';
          S.ui.panel = 'threads';
          if (location.hash !== hash) return void (location.hash = hash);
        }
        if (k === 'cmp') S.ui.cmp[el.dataset.side] = el.value;
        if (k === 'addPerson' && el.value) {
          const v = cur(q);
          const list = el.dataset.list;
          const label = (l) => (list === 'recipients' ? (l.map(rcp).join(', ') || 'none') : names(l));
          const prev = label(v[list]);
          v[list].push(el.value);
          log(q, S.me, list[0].toUpperCase() + list.slice(1), prev, label(v[list]));
          if (list !== 'recipients') notify(el.value, `${name(S.me)} named you among the ${list} of ${q.id} ${q.title}.`, `#/qdoc/${q.id}`);
        }
        if (k === 'quizOn') {
          cur(q).quiz.on = !!el.value;
          log(q, S.me, 'Training', el.value ? 'Read and sign' : 'Read, quiz and sign', el.value ? 'Read, quiz and sign' : 'Read and sign');
        }
        if (k === 'public') {
          cur(q).public = el.checked;
          log(q, S.me, 'Public', el.checked ? 'no' : 'yes', el.checked ? 'yes' : 'no');
        }
        if (k === 'retrain') {
          cur(q).retrain = el.checked;
          log(q, S.me, 'Earlier signers train again', el.checked ? 'no' : 'yes', el.checked ? 'yes' : 'no');
        }
        render();
      });

      document.addEventListener('submit', (e) => {
        const form = e.target.closest('[data-form]');
        if (!form) return;
        e.preventDefault();
        if (form.dataset.form === 'quiz') {
          const k = openK();
          const q = find(k.qid);
          const v = versionOf(k);
          const fd = new FormData(form);
          const answers = v.quiz.questions.map((_, i) => +fd.get('q' + i));
          const wrong = answers.map((a, i) => (a === v.quiz.questions[i].correct ? -1 : i)).filter((i) => i >= 0);
          k.attempts++;
          k.quizPassed = !wrong.length;
          S.ui.quiz = wrong.length ? { kid: k.id, answers, wrong } : null;
          audit(S.me, wrong.length ? 'Quiz attempt failed' : 'Quiz passed', rec(q, v));
          toast(wrong.length ? `${answers.length - wrong.length} of ${answers.length} correct. Every answer must be correct.` : 'Quiz passed. You can sign now.');
          return render();
        }
        const text = new FormData(form).get('text').trim();
        const f = openF();
        if (!text || !f) return;
        if (form.dataset.form === 'reply') f.comments.find((c) => c.id === form.dataset.cid).replies.push({ who: S.me, when: stamp(), text });
        else {
          const c = S.ui.composer;
          const x = f.paras.find((y) => y.id === c.pid);
          if (c.kind === 'comment') f.comments.push({ id: uid('c'), who: S.me, when: stamp(), pid: c.pid, text, replies: [] });
          else if (text !== x.text) f.suggestions.push({ id: uid('s'), who: S.me, when: stamp(), pid: c.pid, to: text, status: 'open' });
          else toast('The suggested text is the same as the paragraph.');
          S.ui.composer = null;
        }
        render();
      });

      // Edits are saved when the paragraph loses focus. No re-render here, so a click that follows still lands.
      document.addEventListener('focusout', (e) => {
        const el = e.target.closest?.('.ptext[contenteditable]');
        const f = openF();
        if (!el || !f) return;
        const x = f.paras.find((y) => y.id === el.dataset.pid);
        const text = el.innerText.replace(/\n+$/, '');
        if (!x || x.text === text) return;
        const what = x.text ? `Edited ${x.h ? 'a heading' : 'a paragraph'}` : `Wrote ${x.h ? 'a heading' : 'a paragraph'}`;
        x.text = text;
        touch(openQ(), cur(openQ()), f, what);
        const saved = $('#saved');
        if (saved) saved.textContent = `Saved at ${stamp().slice(11)}`;
      });

      // The search narrows the table in place, so the field keeps its focus.
      document.addEventListener('input', (e) => {
        if (e.target.id === 'libQ') {
          S.ui.lib.q = e.target.value;
          $('#libBody').innerHTML = libBody(libRows());
          return;
        }
        if (e.target.id !== 'auditQ') return;
        S.ui.audit.q = e.target.value;
        const rows = auditRows();
        $('#auditBody').innerHTML = auditBody(rows);
        $('#auditCount').textContent = auditCount(rows);
      });

      if (!location.hash) location.hash = '#/work';
      render();
    </script>
  </body>
</html>
