<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QDoc UI Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Layout: prototype bar on top, app shell with a left navigation, one main column per screen. */
      :root {
        --bg: #f6f8fb;
        --surface: #ffffff;
        --fg: #1a1f2b;
        --dim: #5b6577;
        --faint: #8a93a3;
        --line: #e1e6ee;
        --line-strong: #cdd4df;
        --brand: #1d4ed8;
        --brand-soft: #eff6ff;
        --brand-ink: #1e40af;
        --on-brand: #ffffff;
        --quote: #f1f4f9;
        --green: #2b8a3e;
        --green-soft: #ebfbee;
        --yellow: #a15c00;
        --yellow-soft: #fff4d6;
        --red: #c92a2a;
        --red-soft: #fff0f0;
        --violet: #6741d9;
        --violet-soft: #f3f0ff;
        --proto: #f4efe3;
        --proto-ink: #6b5a2e;
        --proto-line: #d9c99c;
        --font: 'Raleway', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14171e;
          --surface: #1b1f28;
          --fg: #e4e8ef;
          --dim: #a3acbb;
          --faint: #7a8496;
          --line: #2b313d;
          --line-strong: #3a4250;
          --brand: #60a5fa;
          --brand-soft: #1b2a45;
          --brand-ink: #93c5fd;
          --on-brand: #0f1420;
          --quote: #222835;
          --green: #69db7c;
          --green-soft: #1d3324;
          --yellow: #ffd43b;
          --yellow-soft: #3a3118;
          --red: #ff8787;
          --red-soft: #3d2020;
          --violet: #b197fc;
          --violet-soft: #2a2442;
          --proto: #2a2619;
          --proto-ink: #d8c58f;
          --proto-line: #5a4e2c;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #14171e;
        --surface: #1b1f28;
        --fg: #e4e8ef;
        --dim: #a3acbb;
        --faint: #7a8496;
        --line: #2b313d;
        --line-strong: #3a4250;
        --brand: #60a5fa;
        --brand-soft: #1b2a45;
        --brand-ink: #93c5fd;
        --on-brand: #0f1420;
        --quote: #222835;
        --green: #69db7c;
        --green-soft: #1d3324;
        --yellow: #ffd43b;
        --yellow-soft: #3a3118;
        --red: #ff8787;
        --red-soft: #3d2020;
        --violet: #b197fc;
        --violet-soft: #2a2442;
        --proto: #2a2619;
        --proto-ink: #d8c58f;
        --proto-line: #5a4e2c;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        color: var(--brand);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
        border-radius: 3px;
      }
      h1,
      h2,
      h3 {
        text-wrap: balance;
        font-weight: 600;
        margin: 0;
      }
      h1 {
        font-size: 24px;
        line-height: 1.25;
      }
      h2 {
        font-size: 16px;
      }
      h3 {
        font-size: 14px;
      }
      p {
        margin: 0;
      }
      .mono {
        font-family: var(--mono);
        font-size: 0.92em;
      }
      .dim {
        color: var(--dim);
      }
      .small {
        font-size: 13px;
      }

      /* Prototype chrome */
      .proto {
        background: var(--proto);
        color: var(--proto-ink);
        border-bottom: 1px dashed var(--proto-line);
        padding: 8px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        font-size: 13px;
      }
      .proto-tag {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
      }
      .proto label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        max-width: 100%;
        white-space: nowrap;
      }
      .proto label select {
        min-width: 0;
        flex: 0 1 auto;
      }
      .proto select,
      .proto button {
        border: 1px solid var(--proto-line);
        background: var(--surface);
        color: var(--fg);
        border-radius: 4px;
        padding: 2px 8px;
        max-width: 100%;
      }
      .proto button {
        cursor: pointer;
        background: transparent;
        color: var(--proto-ink);
      }
      .proto .sim {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .proto .push {
        margin-left: auto;
      }

      /* Shell */
      .shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: calc(100vh - 42px);
      }
      .side {
        background: var(--surface);
        border-right: 1px solid var(--line);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .brand {
        font-weight: 700;
        font-size: 18px;
        padding: 0 10px 14px;
        letter-spacing: 0.01em;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 6px;
        color: var(--fg);
        text-decoration: none;
        font-weight: 500;
      }
      .nav:hover {
        background: var(--quote);
      }
      .nav.on {
        background: var(--brand-soft);
        color: var(--brand-ink);
        font-weight: 600;
      }
      .count {
        background: var(--brand);
        color: var(--on-brand);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        padding: 0 7px;
        line-height: 18px;
      }
      .who {
        margin-top: auto;
        padding: 12px 10px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .who b {
        display: block;
        font-size: 14px;
      }
      .main {
        padding: 28px 36px 72px;
        max-width: 1260px;
        min-width: 0;
      }
      .crumbs {
        font-size: 13px;
        color: var(--dim);
        margin-bottom: 8px;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 18px;
      }
      .head .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        margin-top: 8px;
        color: var(--dim);
        font-size: 13px;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      section + section {
        margin-top: 28px;
      }
      section > h2 {
        margin-bottom: 10px;
      }

      /* Controls */
      .btn {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 6px;
        padding: 6px 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        color: var(--fg);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--brand);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--on-brand);
      }
      .btn.danger {
        color: var(--red);
      }
      .btn.sm {
        padding: 2px 10px;
        font-size: 13px;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--brand);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .field {
        display: grid;
        gap: 4px;
        margin-top: 12px;
        font-weight: 600;
        font-size: 13px;
      }
      .field input,
      .field select,
      .field textarea,
      .inp {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 6px;
        padding: 7px 10px;
        font-weight: 400;
        font-size: 15px;
        width: 100%;
      }
      textarea {
        resize: vertical;
        min-height: 84px;
      }
      .hint {
        font-size: 13px;
        color: var(--dim);
        margin-top: 6px;
      }

      /* Pills, chips */
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 1px 10px;
        font-size: 12px;
        font-weight: 600;
        background: var(--quote);
        color: var(--dim);
        white-space: nowrap;
      }
      .pill.s-in-review,
      .pill.v {
        background: var(--violet-soft);
        color: var(--violet);
      }
      .pill.s-in-approval,
      .pill.s-quarantined,
      .pill.y {
        background: var(--yellow-soft);
        color: var(--yellow);
      }
      .pill.s-approved,
      .pill.s-effective,
      .pill.s-released,
      .pill.g {
        background: var(--green-soft);
        color: var(--green);
      }
      .pill.s-published,
      .pill.b {
        background: var(--brand-soft);
        color: var(--brand-ink);
      }
      .pill.s-failed,
      .pill.s-retired,
      .pill.r {
        background: var(--red-soft);
        color: var(--red);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        padding: 2px 6px 2px 10px;
        background: var(--surface);
        font-size: 13px;
      }
      .chip.plain {
        padding-right: 10px;
      }
      .chip button {
        border: 0;
        background: transparent;
        cursor: pointer;
        color: var(--dim);
        border-radius: 999px;
        padding: 0 4px;
        line-height: 1.2;
      }
      .chip button:hover {
        color: var(--red);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .filters button {
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 999px;
        padding: 3px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .filters button[aria-pressed='true'] {
        background: var(--brand-soft);
        border-color: var(--brand);
        color: var(--brand-ink);
        font-weight: 600;
      }

      /* Cards, tables */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .card > h2,
      .card > h3 {
        margin-bottom: 8px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 16px;
      }
      .scroll {
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        font-size: 12px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.num,
      th.num {
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      td.r {
        text-align: right;
        white-space: nowrap;
      }
      td.r .acts {
        flex-wrap: nowrap;
      }
      td.nw {
        white-space: nowrap;
      }
      .panel .tabs button {
        font-size: 13px;
        padding: 8px 10px;
      }
      td a.strong {
        font-weight: 600;
        text-decoration: none;
      }
      .ok {
        color: var(--green);
        font-weight: 700;
      }
      .no {
        color: var(--faint);
      }
      .empty {
        padding: 28px;
        text-align: center;
        color: var(--dim);
      }

      /* Lifecycle */
      .steps {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 0;
        margin: 0 0 14px;
        font-size: 13px;
      }
      .steps li {
        padding: 3px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--faint);
        background: var(--surface);
      }
      .steps li.done {
        color: var(--dim);
        border-color: var(--line-strong);
      }
      .steps li.now {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--on-brand);
        font-weight: 600;
      }
      .banner {
        border: 1px solid var(--line);
        border-left: 4px solid var(--brand);
        background: var(--surface);
        border-radius: 8px;
        padding: 10px 14px;
        margin-bottom: 14px;
      }
      .banner.red {
        border-left-color: var(--red);
        background: var(--red-soft);
      }
      .banner.green {
        border-left-color: var(--green);
      }
      .banner blockquote {
        margin: 6px 0 0;
        padding-left: 10px;
        border-left: 2px solid var(--line-strong);
        font-style: italic;
      }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        border-bottom: 1px solid var(--line);
        margin: 18px 0;
      }
      .tabs a,
      .tabs button {
        padding: 8px 14px;
        text-decoration: none;
        color: var(--dim);
        font-weight: 600;
        border: 0;
        background: transparent;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        cursor: pointer;
      }
      .tabs [aria-current='page'],
      .tabs [aria-pressed='true'] {
        color: var(--brand-ink);
        border-bottom-color: var(--brand);
      }
      .check {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .check li {
        display: flex;
        gap: 8px;
      }

      /* Tasks, notifications */
      .rows {
        display: grid;
        gap: 8px;
      }
      .task {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        justify-content: space-between;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 16px;
      }
      .task .t {
        font-weight: 600;
      }
      .note {
        display: flex;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .note time {
        color: var(--faint);
        font-size: 12px;
        white-space: nowrap;
        flex: 0 0 112px;
        padding-top: 2px;
      }

      /* Content file */
      .fileview {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 20px;
        align-items: start;
      }
      .doc {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 24px 28px;
      }
      .para {
        padding: 3px 0;
        border-left: 3px solid transparent;
        margin-left: -14px;
        padding-left: 11px;
      }
      .para.focus {
        border-left-color: var(--brand);
        background: var(--brand-soft);
      }
      .ptext {
        white-space: pre-wrap;
        border-radius: 4px;
        padding: 2px 4px;
        margin: 0 -4px;
        min-height: 1.55em;
      }
      .para.h .ptext {
        font-size: 18px;
        font-weight: 600;
        margin-top: 10px;
      }
      .ptext[contenteditable]:hover {
        background: var(--quote);
      }
      .ptext[contenteditable]:empty::before {
        content: attr(data-ph);
        color: var(--faint);
      }
      .para {
        position: relative;
      }
      .ptools,
      .pacts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 6px;
        align-items: center;
      }
      .ptools {
        margin: 2px 0 4px;
      }
      .pacts {
        position: absolute;
        right: 0;
        top: -24px;
        z-index: 1;
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        padding: 2px;
        gap: 0;
        opacity: 0;
        pointer-events: none;
      }
      .para:hover .pacts,
      .para:focus-within .pacts,
      .para.focus .pacts {
        opacity: 1;
        pointer-events: auto;
      }
      @media (hover: none) {
        .pacts {
          position: static;
          opacity: 1;
          pointer-events: auto;
          border: 0;
          padding: 0;
        }
      }
      ins {
        background: var(--green-soft);
        color: var(--green);
        text-decoration: underline;
      }
      del {
        background: var(--red-soft);
        color: var(--red);
      }
      .pbreak {
        display: block;
        height: 10px;
      }
      .panel {
        display: grid;
        gap: 10px;
      }
      .thread {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14px;
      }
      .thread.closed {
        opacity: 0.6;
      }
      .thread .by {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--dim);
        margin-bottom: 4px;
      }
      .thread .by b {
        color: var(--fg);
        font-size: 13px;
      }
      .quote {
        background: var(--quote);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        color: var(--dim);
        margin-bottom: 6px;
      }
      .reply {
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 6px;
      }
      .inline {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .inline .inp {
        font-size: 13px;
        padding: 4px 8px;
      }
      .presence {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }

      /* Audit log, QACK figures */
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .bar .inp {
        width: auto;
        max-width: 100%;
      }
      .bar input.inp {
        flex: 1 1 220px;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 32px;
      }
      .stat {
        color: var(--dim);
        font-size: 13px;
      }
      .stat b {
        display: block;
        font-size: 24px;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      /* Reading and training */
      .read {
        display: grid;
        gap: 12px;
      }
      .read .card > .head {
        margin-bottom: 4px;
      }
      .read .foot {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .qz {
        border: 0;
        padding: 0;
        margin: 0 0 14px;
      }
      .qz legend {
        font-weight: 600;
        padding: 0;
        margin-bottom: 4px;
      }
      .qz label {
        display: flex;
        gap: 8px;
        padding: 3px 0;
      }
      .locked {
        opacity: 0.6;
      }

      /* Dialog, toast */
      dialog {
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        color: var(--fg);
        padding: 22px 24px;
        width: min(480px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgb(10 14 22 / 0.5);
      }
      dialog h2 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      dialog .acts {
        justify-content: flex-end;
        margin-top: 18px;
      }
      dialog dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 14px;
        margin: 12px 0 0;
        font-size: 14px;
      }
      dialog dt {
        color: var(--dim);
      }
      dialog dd {
        margin: 0;
        font-weight: 600;
      }
      .err {
        color: var(--red);
        font-size: 13px;
        margin-top: 8px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--fg);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;

      function diff(a, b) {
        const x = a.split(' ');
        const y = b.split(' ');

        for (let i = x.length - 1; i >= 0; i--)
